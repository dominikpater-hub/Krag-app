# Lokalny Postgres do developmentu. Produkcja: Scaleway WAW (O-09).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: krag
      POSTGRES_PASSWORD: krag
      POSTGRES_DB: krag
    ports:
      - "5432:5432"
    volumes:
      - krag_pg:/var/lib/postgresql/data
volumes:
  krag_pg:
